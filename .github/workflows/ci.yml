name: Foundation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Test Python tooling
        run: python3 -m unittest discover -s tests/python -v
      - name: Test optional art Godot serializer
        run: python3 -m unittest discover -s tests/art_godot -v
      - name: Fetch verified dependency and engine
        run: |
          python3 scripts/fetch_dependencies.py
          python3 scripts/install_godot.py
          echo "$GITHUB_WORKSPACE/.deps" >> "$GITHUB_PATH"
      - name: Test standalone art import and relocated playback
        run: python3 scripts/test_art_godot.py
      - name: Assemble example
        run: python3 scripts/prepare_example.py
      - name: Import project
        run: |
          godot --headless --path .build/village --editor --import 2>&1 | tee .build/import.log
          ! grep -E 'SCRIPT ERROR:|^ERROR:' .build/import.log
      - name: Test runtime boundaries
        run: godot --headless --path .build/village --script res://tests/runtime/run.gd
      - name: Test real Dialogue Manager integration
        run: godot --headless --path .build/village --script res://tests/runtime/test_dialogue.gd
      - name: Smoke test the playable main scene
        run: |
          godot --headless --path .build/village --quit-after 5 2>&1 | tee .build/demo-smoke.log
          ! grep -E 'SCRIPT ERROR:|^ERROR:' .build/demo-smoke.log
      - name: Build deterministic release archives
        run: python3 scripts/package_release.py
      - name: Test extracted release bundle
        run: python3 scripts/test_release.py
